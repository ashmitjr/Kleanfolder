name: Build KleanFolder EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./KleanFolder

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build React and Electron
        run: npm run build

      - name: Package Windows EXE
        run: npx electron-builder --win

      - name: Upload EXE for Download
        uses: actions/upload-artifact@v4
        with:
          name: KleanFolder-App
          path: |
            KleanFolder/dist/**/*.exe
            KleanFolder/release/**/*.exe
